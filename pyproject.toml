[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai-receptionist"
version = "1.0.0"
description = "Voice AI receptionist for a dental clinic, with live Google Calendar booking"
requires-python = ">=3.10, <3.15"

dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "livekit-agents[deepgram,google]~=1.8",
    "livekit-api>=1.2.1",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "uvicorn>=0.54.0",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
