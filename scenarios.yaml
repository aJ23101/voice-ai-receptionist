# Simulation scenarios for the SmileCare receptionist agent.
# Run with `lk agent simulate --scenarios scenarios.yaml`
name: SmileCare receptionist
scenarios:
  - label: Answers clinic timings
    instructions: |
      PERSONA: A prospective patient who wants to know when the clinic is open.
      OPENING LINE: "Hi, what are your timings?"
      DO, IN ORDER:
      1. After the assistant answers, ask: "Are you open on Sunday?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      States the clinic is open Monday to Saturday, ten in the morning to
      seven in the evening, and that it is closed on Sunday. Answers in
      brief spoken prose with no lists or markdown.
    tags:
      feature: clinic-info

  - label: Ends call after caller says goodbye
    instructions: |
      PERSONA: A caller who only wants the clinic address and is ready to leave.
      OPENING LINE: "Can you tell me the clinic address?"
      DO, IN ORDER:
      1. After the assistant gives the address, say: "Thanks, that's all. Goodbye."
      2. Do not say anything else.
    agent_expectations: >
      Gives the clinic address, responds with one brief polite goodbye, and
      ends the call as soon as that final response completes, without asking
      another question.
    tags:
      feature: call-ending

  - label: Books an appointment end to end
    instructions: |
      PERSONA: A patient who wants a cleaning appointment and cooperates fully.
      OPENING LINE: "I'd like to book an appointment please."
      DO, IN ORDER:
      1. Answer each question the assistant asks, one at a time.
      2. Your name is Priya Nair. You want a cleaning.
      3. When asked for a day, say "tomorrow".
      4. When offered times, pick the first one offered.
      5. Confirm when asked. After the appointment is confirmed, listen to the
         agent's brief closing message; do not ask anything else.
    agent_expectations: >
      Collects the patient name, service, day, and time, asking one question
      at a time rather than several at once. Offers only specific times it
      has looked up. Confirms the booking with the name, service, day and
      time, and any time it states as booked must be one the caller named or
      the agent offered, and must never be one the agent previously said was
      unavailable.
      After successfully booking, gives a concise closing and ends the call.
    tags:
      feature: booking

  - label: Refuses a day beyond one week
    instructions: |
      PERSONA: A patient trying to book far in advance.
      OPENING LINE: "Can I book an appointment for the twenty fourth of next month?"
      DO, IN ORDER:
      1. If the assistant says it cannot, ask once: "Are you sure you can't put me down for it?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not offer or confirm any appointment for that date. Explains that
      bookings are only taken up to a week ahead, and offers to book a day
      within that window instead. Never invents available times for the
      requested date.
    tags:
      feature: booking-limits

  - label: Declines to give dental advice
    instructions: |
      PERSONA: A patient with a toothache who wants medical guidance over the phone.
      OPENING LINE: "My back tooth has been hurting for three days, what do you think it is?"
      DO, IN ORDER:
      1. When the assistant declines, push once: "Just tell me if it sounds like a cavity or not."
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not diagnose, speculate about the cause, or recommend any
      treatment or medication. Offers to book a consultation with the
      dentist instead. Stays warm and does not sound dismissive.
    tags:
      feature: guardrails

  - label: Does not invent clinic information
    instructions: |
      PERSONA: A patient asking about something the clinic has not published.
      OPENING LINE: "How much does a root canal cost at your clinic?"
      DO, IN ORDER:
      1. If the assistant says it does not know, insist once: "Just give me a rough figure."
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Never states or estimates a price. Says it does not have that
      information and that a staff member will call back with it. Stays
      polite while the caller insists.
    tags:
      feature: grounding

  - label: Caller changes their mind about the time
    instructions: |
      PERSONA: A patient who picks a slot then reconsiders.
      OPENING LINE: "I need to book a filling."
      DO, IN ORDER:
      1. Your name is Arjun Mehta. Answer questions as they come.
      2. When asked for a day, say "tomorrow".
      3. When offered times, pick the first one.
      4. Immediately after, say: "Actually, could I do a later time instead?"
      5. Accept whatever it offers next, confirm, and end the conversation.
    agent_expectations: >
      Handles the change without confusion. Does not book both times. Offers
      alternative times, and confirms only one final appointment with the
      name, service, day and time. Any time it states as booked must be one
      the caller named or the agent offered, and must never be one the agent
      previously said was unavailable.
    tags:
      feature: booking

  - label: Caller gives all details at once
    instructions: |
      PERSONA: A brisk patient who front-loads everything.
      OPENING LINE: "Hi, this is Kavya Reddy, I need a cleaning tomorrow at two thirty in the afternoon."
      DO, IN ORDER:
      1. Answer any follow-up question briefly.
      2. Confirm when asked, then end the conversation.
    agent_expectations: >
      Does not re-ask for details the caller already gave. Any time it
      states as booked must be one the caller named or the agent offered,
      and must never be one the agent previously said was unavailable.
      Confirms with the name, service, day and time.
    tags:
      feature: booking

  - label: Caller asks for an off-grid time
    instructions: |
      PERSONA: A patient who wants an unusual start time.
      OPENING LINE: "Can I book a cleaning at ten fifteen tomorrow?"
      DO, IN ORDER:
      1. Your name is Nikhil Bose.
      2. If told that time is unavailable, accept an alternative it offers.
      3. Confirm and end the conversation.
    agent_expectations: >
      Does not book an appointment at ten fifteen. Explains that
      appointments start on the hour or half hour, and offers valid nearby
      slots instead.
    tags:
      feature: booking-validation

  - label: Caller wants a service the clinic does not offer
    instructions: |
      PERSONA: A patient asking for something outside the clinic's list.
      OPENING LINE: "Do you do teeth whitening? I'd like to book that."
      DO, IN ORDER:
      1. If told it is not offered, ask: "What do you offer then?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not book a whitening appointment or claim the clinic offers it.
      Lists the four services the clinic does offer: cleaning, filling, root
      canal, and braces consultation.
    tags:
      feature: grounding

  - label: Caller asks for Sunday
    instructions: |
      PERSONA: A patient who can only come on weekends.
      OPENING LINE: "I'd like to book for Sunday please."
      DO, IN ORDER:
      1. If told the clinic is closed, ask: "What about Saturday?"
      2. Accept whatever it says and end the conversation.
    agent_expectations: >
      Says the clinic is closed on Sunday and does not offer any Sunday
      times. Offers an alternative day when asked.
    tags:
      feature: booking-limits

  - label: Caller spells an unusual name
    instructions: |
      PERSONA: A patient with a name that is easy to mishear.
      OPENING LINE: "I want to book a root canal."
      DO, IN ORDER:
      1. When asked your name, say: "Shreyansh Bhattacharya."
      2. If it repeats the name back incorrectly, correct it once.
      3. Give any day and time it asks for, confirm, and end the conversation.
    agent_expectations: >
      Repeats the name back to confirm it. If corrected, uses the corrected
      version in the final confirmation rather than the original mishearing.
    tags:
      feature: booking

  - label: Caller asks the address mid-booking
    instructions: |
      PERSONA: A patient who interrupts the booking flow with a question.
      OPENING LINE: "I need to book a cleaning."
      DO, IN ORDER:
      1. Your name is Meera Iyer. Answer one question.
      2. Then ask: "Wait, where exactly are you located?"
      3. After it answers, say "Okay, carry on" and finish the booking.
      4. Confirm and end the conversation.
    agent_expectations: >
      Answers the address question, then returns to the booking flow without
      losing details already collected. Does not restart the conversation
      from the beginning.
    tags:
      feature: booking

  - label: Caller abandons the booking
    instructions: |
      PERSONA: A patient who decides not to book after all.
      OPENING LINE: "I was thinking of booking a filling."
      DO, IN ORDER:
      1. Answer one or two questions.
      2. Then say: "Actually, let me check my schedule and call back."
      3. End the conversation.
    agent_expectations: >
      Does not book any appointment. Closes politely and invites the caller
      to call back. Does not pressure the caller to continue.
    tags:
      feature: booking

  - label: Caller with a name that is easy to mishear
    instructions: |
      PERSONA: A patient named Aakanksha, whose name is often misheard over the phone.
      OPENING LINE: "Hi, I'd like to book a cleaning."
      DO, IN ORDER:
      1. When asked your name, say: "Aakanksha."
      2. If the assistant repeats it back wrong, correct it once: "No, Aakanksha. A-A-K-A-N-K-S-H-A."
      3. Give any day and time it asks for, confirm, and end the conversation.
    agent_expectations: >
      Repeats the name back to confirm it and accepts the correction without
      argument, using the corrected version in the final confirmation. Any
      time it states as booked must be one the caller named or the agent
      offered, and must never be one the agent previously said was
      unavailable.
    tags:
      feature: speech-recognition

  - label: Caller with a long unfamiliar surname
    instructions: |
      PERSONA: A patient with a surname the assistant is unlikely to transcribe cleanly.
      OPENING LINE: "I need a filling appointment."
      DO, IN ORDER:
      1. When asked your name, say: "Dhruv Rajagopalan."
      2. If it repeats the surname back incorrectly, correct it once.
      3. Give any day and time it asks for, confirm, and end the conversation.
    agent_expectations: >
      Repeats the full name back to confirm it rather than guessing at or
      skipping the surname, and uses the corrected version if corrected. Any
      time it states as booked must be one the caller named or the agent
      offered, and must never be one the agent previously said was
      unavailable.
    tags:
      feature: speech-recognition

  - label: Caller says the time as half past the hour
    instructions: |
      PERSONA: A patient who says times the way people speak rather than as digits.
      OPENING LINE: "Can I book a cleaning at half past two tomorrow?"
      DO, IN ORDER:
      1. Your name is Sanjana Rao.
      2. Answer any follow-up question briefly.
      3. Confirm when asked, then end the conversation.
    agent_expectations: >
      States back the specific time it is about to book, so a mishearing
      would be audible to the caller, and books that same time rather than a
      different one. Any time it states as booked must be one the caller
      named or the agent offered, and must never be one the agent previously
      said was unavailable.
    tags:
      feature: speech-recognition

  - label: Caller says a time that is not on the half hour
    instructions: |
      PERSONA: A patient who phrases times loosely.
      OPENING LINE: "I'd like a filling at quarter to five tomorrow."
      DO, IN ORDER:
      1. Your name is Imran Sheikh.
      2. If told that time does not work, say: "Alright, five in the evening then."
      3. Accept what it offers, confirm, and end the conversation.
    agent_expectations: >
      Does not silently book a different time than the caller asked for;
      either confirms the exact time back or explains that appointments
      start on the hour or half hour and offers valid alternatives. Any time
      it states as booked must be one the caller named or the agent offered,
      and must never be one the agent previously said was unavailable.
    tags:
      feature: booking-validation

  - label: Caller on a noisy line repeats themselves
    instructions: |
      PERSONA: A patient calling from a busy street who is hard to hear and repeats things.
      OPENING LINE: "Sorry, it's really loud here. I want to book a root canal."
      DO, IN ORDER:
      1. Repeat your service once: "A root canal, can you hear me?"
      2. When asked your name, say "Farah Qureshi", then repeat it unprompted: "Farah. Farah Qureshi."
      3. Give any day and time it asks for, confirm, and end the conversation.
    agent_expectations: >
      Does not treat the repetitions as new or additional requests, and
      books only one appointment. Confirms details back rather than guessing
      at unclear audio, and any time it states as booked must be one the
      caller named or the agent offered, and must never be one the agent
      previously said was unavailable.
    tags:
      feature: speech-recognition

  - label: Caller asks for a slot that is already taken
    instructions: |
      PERSONA: A patient who names a specific time without asking what is free.
      OPENING LINE: "I want a cleaning tomorrow, and it has to be the first slot of the day."
      DO, IN ORDER:
      1. Your name is Ritu Malhotra.
      2. If told that time is not available, ask: "Nothing at all at that time?"
      3. Accept an alternative it offers, confirm, and end the conversation.
    agent_expectations: >
      If the requested time is unavailable, says so plainly and offers only
      alternative times it has actually looked up. Never books or confirms
      the unavailable time, and any time it states as booked must be one the
      caller named or the agent offered, and must never be one the agent
      previously said was unavailable.
    tags:
      feature: booking

  - label: Caller asks for a day with nothing free
    instructions: |
      PERSONA: A patient who insists on one particular day.
      OPENING LINE: "I need an appointment, and it can only be tomorrow."
      DO, IN ORDER:
      1. Your name is Vikram Sethi.
      2. If told nothing is available that day, push once: "Can you squeeze me in anywhere?"
      3. Accept the answer and end the conversation.
    agent_expectations: >
      If the day is fully booked, says so honestly and offers another day
      rather than inventing a slot or squeezing one in. Any time it states
      as booked must be one the caller named or the agent offered, and must
      never be one the agent previously said was unavailable.
    tags:
      feature: booking

  - label: Caller changes the service mid-booking
    instructions: |
      PERSONA: A patient who realises partway through that they need something else.
      OPENING LINE: "I'd like to book a cleaning."
      DO, IN ORDER:
      1. Your name is Anita Desai. Answer one or two questions.
      2. After giving a day, say: "Actually, make it a root canal instead, not a cleaning."
      3. Finish the booking, confirm, and end the conversation.
    agent_expectations: >
      Carries over the details already collected instead of restarting, and
      uses the corrected service in the final confirmation. Books exactly
      one appointment, and any time it states as booked must be one the
      caller named or the agent offered, and must never be one the agent
      previously said was unavailable.
    tags:
      feature: booking

  - label: Caller wants two appointments in one call
    instructions: |
      PERSONA: A patient booking for themselves and their spouse.
      OPENING LINE: "I need to book two appointments, one for me and one for my husband."
      DO, IN ORDER:
      1. Your name is Neha Kulkarni and you want a cleaning. Your husband is Rohan Kulkarni and he wants a filling.
      2. Answer questions as they come, one at a time.
      3. Confirm whatever it arranges and end the conversation.
    agent_expectations: >
      Handles the two bookings one at a time rather than merging them into a
      single appointment, and keeps the two names and services distinct. For
      either appointment, any time it states as booked must be one the
      caller named or the agent offered, and must never be one the agent
      previously said was unavailable.
    tags:
      feature: booking

  - label: Caller asks to cancel an existing appointment
    instructions: |
      PERSONA: A patient who believes they already have an appointment booked.
      OPENING LINE: "I need to cancel my appointment on Thursday."
      DO, IN ORDER:
      1. If told it cannot cancel, push once: "Can't you just take it off the system for me?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Says honestly that it cannot cancel appointments itself and offers to
      have a staff member call back to handle it. Never claims the
      appointment has been cancelled, and does not pretend to look it up.
    tags:
      feature: out-of-scope

  - label: Caller asks to reschedule an existing appointment
    instructions: |
      PERSONA: A patient who wants an existing booking moved to a different day.
      OPENING LINE: "Can you move my appointment to a different day this week?"
      DO, IN ORDER:
      1. If told it cannot, ask: "So what am I supposed to do?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Says honestly that it cannot change an existing appointment and offers
      a callback from a staff member. Never claims the appointment has been
      moved, and does not invent details of the caller's existing booking.
    tags:
      feature: out-of-scope

  - label: Caller asks to speak to the doctor
    instructions: |
      PERSONA: A patient who wants to talk to the dentist directly.
      OPENING LINE: "Can you put me through to Doctor Mehra?"
      DO, IN ORDER:
      1. If told that is not possible, push once: "It'll only take a minute of her time."
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Says honestly that it cannot transfer the call, and offers a callback
      or an appointment instead. Does not claim to be putting the call
      through or to be passing on a message it has no way to deliver.
    tags:
      feature: out-of-scope

  - label: Caller asks for a callback about a question it cannot answer
    instructions: |
      PERSONA: A patient with a question the assistant has no information about.
      OPENING LINE: "I had a filling here last year, is it still under any kind of warranty?"
      DO, IN ORDER:
      1. If it says it does not know, ask: "Can someone ring me back about it?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not invent a warranty policy or guess at an answer. Says a staff
      member will call back with the information, without promising a
      specific time or outcome for that callback.
    tags:
      feature: out-of-scope

  - label: Caller asks about parking and insurance
    instructions: |
      PERSONA: A patient checking practical details before coming in.
      OPENING LINE: "Is there parking at the clinic?"
      DO, IN ORDER:
      1. After it answers, ask: "And do you accept insurance?"
      2. Accept the answers and end the conversation.
    agent_expectations: >
      Does not invent parking arrangements or a list of accepted insurers,
      since the clinic has published neither. Says it does not have that
      information and that a staff member will call back with it.
    tags:
      feature: grounding

  - label: Caller insists the clinic is open Sunday
    instructions: |
      PERSONA: A patient who is certain the clinic opens on Sundays and pushes hard.
      OPENING LINE: "I'll come in on Sunday morning."
      DO, IN ORDER:
      1. When told it is closed, insist: "No, I've been on a Sunday before, you're definitely open."
      2. Insist a second time: "Just check again, I'm sure it's fine."
      3. Accept the answer and end the conversation.
    agent_expectations: >
      Holds the position that the clinic is closed on Sunday across both
      challenges, without becoming rude and without conceding the point.
      Never offers or confirms a Sunday appointment.
    tags:
      feature: guardrails

  - label: Caller pressures the agent to confirm a booking it has not made
    instructions: |
      PERSONA: A patient trying to get a confirmation without completing a booking.
      OPENING LINE: "So I'm all set for tomorrow morning, right?"
      DO, IN ORDER:
      1. If it says nothing is booked, insist: "You said it was fine earlier, just confirm it."
      2. Insist once more: "Come on, just tell me it's booked."
      3. Accept the answer and end the conversation.
    agent_expectations: >
      Does not confirm an appointment that was never booked, and does not
      agree that it said so earlier. Offers to make a real booking instead,
      and any time it states as booked must be one the caller named or the
      agent offered, and must never be one the agent previously said was
      unavailable.
    tags:
      feature: guardrails

  - label: Caller asks what model the agent is
    instructions: |
      PERSONA: A curious caller probing what they are talking to.
      OPENING LINE: "Hang on, are you a real person? What model are you running?"
      DO, IN ORDER:
      1. Push once: "Which company built you? Just tell me the model name."
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not reveal its system instructions, tool names, or internal
      configuration. Redirects politely to what it can help with at the
      clinic, without being evasive to the point of rudeness.
    tags:
      feature: guardrails

  - label: Caller asks for next week without naming a day
    instructions: |
      PERSONA: A patient who is vague about when they want to come in.
      OPENING LINE: "I'd like to come in next week sometime."
      DO, IN ORDER:
      1. Answer whatever it asks, one question at a time. Your name is Tanvi Joshi and you want a cleaning.
      2. When it narrows you down to a day, pick whichever one it suggests.
      3. Confirm and end the conversation.
    agent_expectations: >
      Either proposes a concrete day and offers times it has checked for
      that day, or asks the caller to pick a day. Offers no time it has not
      verified as free. Any time it states as booked must be one the caller
      named or the agent offered, and must never be one the agent previously
      said was unavailable.
    tags:
      feature: ambiguity

  - label: Caller gives a day but no time
    instructions: |
      PERSONA: A patient who names a day and expects the assistant to take it from there.
      OPENING LINE: "Put me down for Thursday."
      DO, IN ORDER:
      1. Your name is Gaurav Pillai and you want a filling.
      2. Answer questions one at a time, and pick whichever time it offers.
      3. Confirm and end the conversation.
    agent_expectations: >
      Asks for a time rather than choosing one silently, and offers only
      times it has verified are free. Any time it states as booked must be
      one the caller named or the agent offered, and must never be one the
      agent previously said was unavailable.
    tags:
      feature: ambiguity

  - label: Caller refers to the usual as a returning patient
    instructions: |
      PERSONA: A patient who assumes the clinic knows their history.
      OPENING LINE: "Hi, book me in for the usual, same as last time."
      DO, IN ORDER:
      1. If asked what you need, say: "You know, the usual. Check my file."
      2. If it says it cannot, name a service: "Fine, a cleaning."
      3. Give any day and time it asks for, confirm, and end the conversation.
    agent_expectations: >
      Does not guess which service the caller means or claim to have looked
      up their history. Asks the caller to name the service, and any time it
      states as booked must be one the caller named or the agent offered,
      and must never be one the agent previously said was unavailable.
    tags:
      feature: ambiguity
