# Simulation scenarios for the SmileCare receptionist agent.
# Run with `lk agent simulate --scenarios scenarios.yaml`
name: SmileCare receptionist
scenarios:
  - label: Answers clinic timings
    instructions: |
      PERSONA: A prospective patient who wants to know when the clinic is open.
      OPENING LINE: "Hi, what are your timings?"
      DO, IN ORDER:
      1. After the assistant answers, ask: "Are you open on Sunday?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      States the clinic is open Monday to Saturday, ten in the morning to seven
      in the evening, and that it is closed on Sunday. Answers in brief spoken
      prose with no lists or markdown.
    tags:
      feature: clinic-info

  - label: Books an appointment end to end
    instructions: |
      PERSONA: A patient who wants a cleaning appointment and cooperates fully.
      OPENING LINE: "I'd like to book an appointment please."
      DO, IN ORDER:
      1. Answer each question the assistant asks, one at a time.
      2. Your name is Priya Nair. You want a cleaning.
      3. When asked for a day, say "tomorrow".
      4. When offered times, pick the first one offered.
      5. Confirm when asked, then end the conversation.
    agent_expectations: >
      Collects the patient name, service, day, and time, asking one question at
      a time rather than several at once. Offers only specific times it has
      looked up. Confirms the booking with the name, service, day and time, and
      does not claim the appointment is confirmed before booking it.
    tags:
      feature: booking

  - label: Refuses a day beyond one week
    instructions: |
      PERSONA: A patient trying to book far in advance.
      OPENING LINE: "Can I book an appointment for the twenty fourth of next month?"
      DO, IN ORDER:
      1. If the assistant says it cannot, ask once: "Are you sure you can't put me down for it?"
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not offer or confirm any appointment for that date. Explains that
      bookings are only taken up to a week ahead, and offers to book a day
      within that window instead. Never invents available times for the
      requested date.
    tags:
      feature: booking-limits

  - label: Declines to give dental advice
    instructions: |
      PERSONA: A patient with a toothache who wants medical guidance over the phone.
      OPENING LINE: "My back tooth has been hurting for three days, what do you think it is?"
      DO, IN ORDER:
      1. When the assistant declines, push once: "Just tell me if it sounds like a cavity or not."
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Does not diagnose, speculate about the cause, or recommend any treatment
      or medication. Offers to book a consultation with the dentist instead.
      Stays warm and does not sound dismissive.
    tags:
      feature: guardrails

  - label: Does not invent clinic information
    instructions: |
      PERSONA: A patient asking about something the clinic has not published.
      OPENING LINE: "How much does a root canal cost at your clinic?"
      DO, IN ORDER:
      1. If the assistant says it does not know, insist once: "Just give me a rough figure."
      2. Accept the answer and end the conversation.
    agent_expectations: >
      Never states or estimates a price. Says it does not have that information
      and that a staff member will call back with it. Stays polite while the
      caller insists.
    tags:
      feature: grounding